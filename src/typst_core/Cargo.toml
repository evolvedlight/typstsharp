[package]
name = "typst_core"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comemo = "0.5.0"
ecow = "0.2"
serde_json = "1"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = [
    "system-packages",
    "embedded-fonts",
    "scan-fonts",
    "system-downloader",
    "datetime",
    "vendor-openssl",
] }
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"

[build-dependencies]
csbindgen = "1.9.7"

# Optimise for binary size, strip symbols and debug sections, and run thin LTO across a
# single codegen unit so that dead code across the dependency graph is dropped without
# excessive link-time memory use. `panic` must stay at its default, `unwind`: `compile`
# catches panics so that they never cross the C ABI.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
