name: pack

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(grep -m1 '<Version>' src/PackageMetadata.props | sed -E 's/.*<Version>(.+)<\/Version>.*/\1/')
          branch="${GITHUB_REF_NAME:-}"
          if [ -z "$branch" ] && [ -n "${GITHUB_HEAD_REF:-}" ]; then
            branch="$GITHUB_HEAD_REF"
          fi
          if [ "$branch" != "master" ]; then
            package_version="${base_version}-preview.${GITHUB_RUN_NUMBER}"
          else
            package_version="$base_version"
          fi
          echo "Base version: $base_version"
          echo "Branch: ${branch:-unknown}"
          echo "Using package version: $package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-packages.yml
    with:
      package_version: ${{ needs.version.outputs.package_version }}
      run_tests: true

  test-package:
    name: Test package (${{ matrix.name }})
    needs:
      - version
      - build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: Ubuntu x64
            os: ubuntu-latest
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: Alpine x64 (musl)
            os: ubuntu-latest
            test_type: docker-alpine
          - name: Alpine ARM64 (musl)
            os: ubuntu-24.04-arm
            test_type: docker-alpine
          - name: Fedora x64 (new glibc)
            os: ubuntu-latest
            test_type: docker-fedora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          name: typstsharp-${{ needs.version.outputs.package_version }}
          path: artifacts

      - name: Install .NET SDK
        if: matrix.test_type == ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.x

      - name: Run tests (native host)
        if: matrix.test_type == ''
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          dotnet nuget add source "${{ github.workspace }}/artifacts" --name local-artifacts
          dotnet nuget locals all --clear
          dotnet restore src/typstsharp.tests/typstsharp.tests.csproj -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }}
          dotnet test --project src/typstsharp.tests/typstsharp.tests.csproj -c Release -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }} --no-restore

      - name: Run tests (Alpine musl)
        if: matrix.test_type == 'docker-alpine'
        shell: bash
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace mcr.microsoft.com/dotnet/sdk:11.0-alpine sh -c "
            set -eu
            dotnet nuget add source /workspace/artifacts --name local-artifacts
            dotnet nuget locals all --clear
            dotnet restore src/typstsharp.tests/typstsharp.tests.csproj -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }}
            dotnet test --project src/typstsharp.tests/typstsharp.tests.csproj -c Release -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }} --no-restore
          "

      - name: Run tests (Fedora)
        if: matrix.test_type == 'docker-fedora'
        shell: bash
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:40 sh -c "
            set -eu
            dnf install -y curl tar icu
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 11.0 --install-dir /usr/share/dotnet
            ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
            dotnet nuget add source /workspace/artifacts --name local-artifacts
            dotnet nuget locals all --clear
            dotnet restore src/typstsharp.tests/typstsharp.tests.csproj -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }}
            dotnet test --project src/typstsharp.tests/typstsharp.tests.csproj -c Release -p:UsePackagedLibrary=true -p:PackageVersion=${{ needs.version.outputs.package_version }} --no-restore
          "
